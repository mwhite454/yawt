name: Build and Test

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Run linter
        run: deno lint

      - name: Type check
        run: |
          find routes utils -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 -n 50 deno check --unstable-kv
          deno check --unstable-kv fresh.config.ts fresh.gen.ts main.ts
        env:
          # OAuth Configuration (OAUTH_* prefix used because GITHUB_* is reserved)
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REDIRECT_URI: ${{ secrets.OAUTH_REDIRECT_URI || 'http://localhost:8000/auth/callback' }}

          # Cloudflare R2 Configuration
          CLOUDFLARE_S3_ENDPOINT: ${{ secrets.CLOUDFLARE_S3_ENDPOINT }}
          CLOUDFLARE_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY_ID }}
          CLOUDFLARE_S3_SECRET: ${{ secrets.CLOUDFLARE_S3_SECRET }}
          CLOUDFLARE_S3_BUCKET: ${{ secrets.CLOUDFLARE_S3_BUCKET }}
